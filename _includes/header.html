<h1><a href="{{ '/' | relative_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>

{% if site.logo %}
  <img src="{{ site.logo | relative_url }}" alt="Logo" />
{% endif %}

<!-- Your Custom Sidebar Navigation Menu -->
<nav style="margin-top: 20px; margin-bottom: 20px;">
  <ul style="list-style-type: none; padding-left: 0; line-height: 1.8;">
    <li><a href="{{ '/' | relative_url }}" style="font-weight: bold; text-decoration: none;">🏠 Home</a></li>
    <li><a href="{{ '/projects/' | relative_url }}" style="font-weight: bold; text-decoration: none;">📂 Projects</a></li>
    <li><a href="{{ '/experience/' | relative_url }}" style="font-weight: bold; text-decoration: none;">💼 Experience</a></li>
    <li><a href="{{ '/volunteering/' | relative_url }}" style="font-weight: bold; text-decoration: none;">🤝 Volunteering</a></li>
  </ul>
</nav>

<p>{{ site.description | default: site.github.project_tagline }}</p>
